name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.9" # matches the Dockerfile's builder image

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -tags integration ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The minimum from go.mod and the version we ship.
        go: ["1.24.4", "1.26.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: go test -race
        run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ["6333:6333"]
      redis:
        image: redis:8.10.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      QDRANT_URL: http://localhost:6333
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Wait for Qdrant
        # The Qdrant image has no curl for a service health check; poll from the runner.
        run: |
          for i in $(seq 1 60); do
            curl -sf "$QDRANT_URL/readyz" && exit 0
            sleep 1
          done
          echo "Qdrant did not become ready"; exit 1
      - name: Integration tests (real Qdrant and Redis, no API key)
        run: go test -tags integration -race -count=1 -v ./internal/integration ./internal/session

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -t askyourbook:ci .
