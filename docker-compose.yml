services:
  api:
    build: .
    # Published on localhost only; nothing here has authentication.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    # API keys and tunables come from .env; the addresses below point at the
    # other services on the compose network and take precedence.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      QDRANT_URL: http://qdrant:6333
      SESSION_STORE: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Shutdown waits up to 10s for HTTP requests, 30s for ingests, then up to
    # 30s for cancelled ingests to clean up their partial chunks.
    stop_grace_period: 80s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333"   # REST API + dashboard at http://localhost:6333/dashboard
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget; use bash's /dev/tcp to hit /readyz.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"   # set REDIS_PORT if a local Redis already uses 6379
    # Append-only file so chat sessions survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:
  redis_data:
